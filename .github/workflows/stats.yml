name: update-stats

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # manual run button
  push:
    paths:
      - "scripts/stats.py"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        run: python3 scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: a classic PAT (read:user) as repo secret STATS_TOKEN
          # gives the most reliable contribution heatmap
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-mobile.svg
          git diff --staged --quiet || (git commit -m "chore: update stats" && git push)
